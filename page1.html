<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Legion Tech Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>

<body>

    <header class="navbar">
        <img class="logo-img" src="Lenovo_Legion_Logo.png" alt="Legion Logo">
        
        <nav class="nav-links">
            <a href="https://en.wikipedia.org/wiki/Category:Lenovo_laptops">Lenovo Laptops</a>
            <a href="https://www.lenovo.com/us/en/accessories-and-software/">Accessories & Soft</a>
            <a href="https://www.lenovo.com/us/en/about/">About Us</a>
        </nav>

        <div class="nav-buttons">
            <button class="btn-green">Get in touch</button>
            <button class="btn-blue">Order a laptop</button>
        </div>
    </header>

    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">We Deliver High-Performance Laptops</h1>
            <p class="hero-desc">Power your work and gaming experience with our cutting-edge technology.</p>
            <button class="btn-blue btn-large">Explore Laptops ></button>
        </div>

        <div class="hero-image">
            <img class="laptop-img" src="lenovo-legion-agnostic-showcase-product-2 (1).png" alt="Gaming Laptop">
        </div>
    </section>

    <div class="mb-3 row">
  <label for="staticEmail" class="sm:col-2 col-form-label">Email</label>
  <div class="sm:col-10">
    <input type="text" readonly class="form-control-plaintext" id="staticEmail" value="email@example.com">
  </div>
</div>
<div class="mb-3 row">
  <label for="inputPassword" class="sm:col-2 col-form-label">Password</label>
  <div class="sm:col-10">
    <input type="password" class="form-control" id="inputPassword">
  </div>
</div>

</body>
</html>
